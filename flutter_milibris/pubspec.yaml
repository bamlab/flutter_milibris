name: flutter_milibris
description: >-
  A Flutter plugin that bridges Milibris SDKs, enabling encrypted archive
  extraction and embedded reader functionality on Android and iOS.
version: 0.1.0+1
homepage: https://github.com/bamlab/flutter_milibris
repository: https://github.com/bamlab/flutter_milibris

environment:
  sdk: ^3.11.0

flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_milibris_android
      ios:
        default_package: flutter_milibris_ios

dependencies:
  flutter:
    sdk: flutter
  flutter_milibris_android: ^0.1.0
  flutter_milibris_ios: ^0.1.0
  flutter_milibris_platform_interface: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  plugin_platform_interface: ^2.1.8
  theodo_analysis: ^1.11.0
