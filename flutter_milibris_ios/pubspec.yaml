name: flutter_milibris_ios
description: iOS implementation of the flutter_milibris plugin
version: 0.2.2
homepage: https://github.com/bamlab/flutter_milibris
repository: https://github.com/bamlab/flutter_milibris

environment:
  sdk: ^3.11.0
  flutter: '>=1.20.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  flutter_milibris_platform_interface: ^0.2.2
  objective_c: ^9.3.0

dev_dependencies:
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  theodo_analysis: ^1.11.0

flutter:
  plugin:
    implements: flutter_milibris
    platforms:
      ios:
        pluginClass: FlutterMilibrisPlugin
        dartPluginClass: FlutterMilibrisIOS
